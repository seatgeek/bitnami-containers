name: Build and publish pgbouncer image

on:
  push:
    branches:
      - main
    paths:
      - 'bitnami/pgbouncer/**'
      - '.github/workflows/pgbouncer-build.yml'
  pull_request:
    paths:
      - 'bitnami/pgbouncer/**'
      - '.github/workflows/pgbouncer-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pgbouncer
  DOCKERFILE_PATH: bitnami/pgbouncer/1/debian-12
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract image metadata
        id: meta
        run: |
          version="$(grep 'APP_VERSION=' "${DOCKERFILE_PATH}/Dockerfile" | head -1 | cut -d'"' -f2)"
          revision="$(grep 'IMAGE_REVISION=' "${DOCKERFILE_PATH}/Dockerfile" | head -1 | cut -d'"' -f2)"
          tag="${version}-debian-12-r${revision}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.DOCKERFILE_PATH }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
